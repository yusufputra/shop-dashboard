name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      macos_arm64:
        description: Build macOS (Apple Silicon / arm64)
        type: boolean
        default: true
      macos_x64:
        description: Build macOS (Intel / x64)
        type: boolean
        default: true
      windows_x64:
        description: Build Windows (x64)
        type: boolean
        default: true


concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix
        id: set-matrix
        env:
          MACOS_ARM64: ${{ github.event_name == 'push' || inputs.macos_arm64 }}
          MACOS_X64: ${{ github.event_name == 'push' || inputs.macos_x64 }}
          WINDOWS_X64: ${{ github.event_name == 'push' || inputs.windows_x64 }}
        run: |
          include="[]"

          if [ "$MACOS_ARM64" = "true" ]; then
            include=$(echo "$include" | jq '. += [{
              "platform": "macos-arm64",
              "runner": "macos-latest",
              "rust_targets": "aarch64-apple-darwin",
              "tauri_target": "aarch64-apple-darwin",
              "tauri_args": "--target aarch64-apple-darwin"
            }]')
          fi

          if [ "$MACOS_X64" = "true" ]; then
            include=$(echo "$include" | jq '. += [{
              "platform": "macos-x64",
              "runner": "macos-latest",
              "rust_targets": "x86_64-apple-darwin",
              "tauri_target": "x86_64-apple-darwin",
              "tauri_args": "--target x86_64-apple-darwin"
            }]')
          fi

          if [ "$WINDOWS_X64" = "true" ]; then
            include=$(echo "$include" | jq '. += [{
              "platform": "windows-x64",
              "runner": "windows-latest",
              "rust_targets": "x86_64-pc-windows-msvc",
              "tauri_target": "x86_64-pc-windows-msvc",
              "tauri_args": "--target x86_64-pc-windows-msvc"
            }]')
          fi

          count=$(echo "$include" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "No platforms selected. Enable at least one platform."
            exit 1
          fi

          matrix=$(jq -n --argjson include "$include" '{include: $include}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Create .env.local
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$AUTH_SESSION_SECRET" ]; then
            echo "Missing required GitHub secrets. Add NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, and AUTH_SESSION_SECRET."
            exit 1
          fi

          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          AUTH_SESSION_SECRET=${AUTH_SESSION_SECRET}
          EOF

      - name: Download Node sidecar
        shell: bash
        env:
          TAURI_TARGET: ${{ matrix.tauri_target }}
        run: node scripts/download-node-sidecar.mjs

      - name: Build Tauri app
        run: npm run tauri -- build ${{ matrix.tauri_args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: shop-dashboard-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.tauri_target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.tauri_target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.tauri_target }}/release/bundle/nsis/*.exe

  release:
    name: Publish Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release installers
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -exec cp {} release-assets/ \;

          if [ -z "$(ls -A release-assets)" ]; then
            echo "No installer files found (.dmg, .msi, .exe)."
            exit 1
          fi

          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
